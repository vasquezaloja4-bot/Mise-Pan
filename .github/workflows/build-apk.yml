name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies and build web assets
        run: |
          npm install --legacy-peer-deps
          npm install --no-save --legacy-peer-deps @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          rm -rf android capacitor.config.ts capacitor.config.json
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.vasquezaloja.misepan",
            "appName": "Mise & Pan",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Configure Android permissions and Kotlin resolution
        run: |
          python3 - << 'EOF'
          from pathlib import Path

          # 1. Add permissions to AndroidManifest.xml
          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          if manifest_path.exists():
              manifest = manifest_path.read_text(encoding="utf-8")
              perms = """    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
          """
              if "android.permission.CAMERA" not in manifest and "<application" in manifest:
                  manifest = manifest.replace("<application", perms + "\n    <application", 1)
                  manifest_path.write_text(manifest, encoding="utf-8")

          # 2. Align Kotlin stdlib across all Gradle projects
          root_gradle = Path("android/build.gradle")
          if root_gradle.exists():
              gradle_txt = root_gradle.read_text(encoding="utf-8")
              subprojects_fix = """
          allprojects {
              configurations.configureEach {
                  resolutionStrategy {
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
                  }
              }
          }
          """
              if "configurations.configureEach" not in gradle_txt:
                  gradle_txt = gradle_txt + "\n" + subprojects_fix
                  root_gradle.write_text(gradle_txt, encoding="utf-8")
          EOF

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mise-and-Pan-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
